# LCA 单机编排 — 基础设施与应用均支持 linux/amd64 与 linux/arm64
# 推荐: make docker-up   （会先按本机架构编译 release/bin/<arch>/）
services:
  # ==================== 基础设施 ====================

  mysql:
    # 官方多架构镜像（linux/amd64 + linux/arm64）
    image: docker.m.daocloud.io/library/mysql:8.0
    container_name: lca-mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-lca2024}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lca}
      MYSQL_CHARSET: utf8mb4
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deploy/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-lca2024}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lca-net

  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    container_name: lca-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-lca2024}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-lca2024}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lca-net

  zookeeper:
    image: docker.m.daocloud.io/library/zookeeper:3.9
    container_name: lca-zookeeper
    restart: always
    ports:
      - "2181:2181"
    environment:
      TZ: Asia/Shanghai
    networks:
      - lca-net

  kafka:
    # wurstmeister 多架构（amd64/arm64），环境变量与历史 lcalog/kafka 兼容
    image: docker.m.daocloud.io/wurstmeister/kafka:2.13-2.8.1
    container_name: lca-kafka
    restart: always
    ports:
      # 9092 给容器内服务（advertised 为 lca-kafka，宿主机不要拿它当 bootstrap）
      # 9094 给宿主机上的客户端，advertised 为 127.0.0.1
      - "9092:9092"
      - "9094:9094"
    environment:
      TZ: Asia/Shanghai
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INSIDE://0.0.0.0:9092,OUTSIDE://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INSIDE://lca-kafka:9092,OUTSIDE://127.0.0.1:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_LOG_SEGMENT_BYTES: 536870912
      KAFKA_COMPRESSION_TYPE: lz4
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/kafka
    depends_on:
      - zookeeper
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - lca-net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.25
    container_name: lca-elasticsearch
    restart: always
    # 启动前把 /data/backups 属主改成 elasticsearch，否则本地快照仓库无法创建子目录
    entrypoint: ["/bin/tini", "--", "/bin/bash", "/usr/local/bin/lca-es-entrypoint.sh"]
    command: ["eswrapper"]
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - TZ=Asia/Shanghai
      - node.name=es01
      - cluster.name=lca-es-cluster
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=${ES_JAVA_OPTS:--Xms512m -Xmx512m} -Duser.timezone=Asia/Shanghai"
      - "path.repo=/data/backups"
      - bootstrap.system_call_filter=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - es_data:/usr/share/elasticsearch/data
      - es_backups:/data/backups
      - ./deploy/es/entrypoint.sh:/usr/local/bin/lca-es-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - lca-net

  # ==================== 应用服务 ====================

  admin:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        APP_NAME: admin
        TARGETARCH: ${LCA_TARGETARCH}
    container_name: lca-admin
    restart: always
    ports:
      - "${ADMIN_PORT:-8080}:8080"
    volumes:
      - ./configs/admin-docker.yaml:/app/config.yaml
      - ./configs/rbac_model.conf:/app/configs/rbac_model.conf
      # 机器ID持久化（避免容器重启后机器ID变化导致授权码失效）
      - ./data/admin:/app/data
      # 日志挂载到宿主机便于排查
      - ./logs/admin:/app/logs
      # 商业交付：预编译 Agent，供一键部署脚本从管理端下载
      - ./release/bin:/app/agent-bin:ro
    environment:
      LCA_MACHINE_ID: "${LCA_MACHINE_ID:-}"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    networks:
      - lca-net

  apiserver:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        APP_NAME: apiserver
        TARGETARCH: ${LCA_TARGETARCH}
    container_name: lca-apiserver
    restart: always
    ports:
      - "${API_PORT:-8086}:8086"
    volumes:
      - ./configs/apiserver-docker.yaml:/app/config.yaml
      - ./logs/apiserver:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8086/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    networks:
      - lca-net

  logtransfer:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        APP_NAME: logtransfer
        TARGETARCH: ${LCA_TARGETARCH}
    container_name: lca-logtransfer
    restart: always
    volumes:
      - ./configs/logtransfer-docker.yaml:/app/config.yaml
      - ./logs/logtransfer:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    networks:
      - lca-net

  # 日志采集 Agent 不随主 compose 启动，请用宿主机独立部署：
  #   deploy/logcollect/ （或 scripts/install-agent-linux.sh）

  # ==================== Syslog 接收器 ====================

  syslog:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        APP_NAME: syslog
        TARGETARCH: ${LCA_TARGETARCH}
    container_name: lca-syslog
    restart: always
    ports:
      # 直接映射端口（不经 nginx，Docker DNAT 保留真实源 IP）
      - "514:514/udp"
      - "514:514/tcp"
    volumes:
      - ./configs/syslog-docker.yaml:/app/config.yaml
      - ./logs/syslog:/app/logs
      - ./data/syslog/dead_letters:/app/dead_letters
    environment:
      - TZ=Asia/Shanghai
    depends_on:
      apiserver:
        condition: service_healthy
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    networks:
      - lca-net

  # ==================== 前端 ====================

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    container_name: lca-web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - admin
    networks:
      - lca-net

volumes:
  mysql_data:
  redis_data:
  kafka_data:
  es_data:
  es_backups:

networks:
  lca-net:
    driver: bridge
