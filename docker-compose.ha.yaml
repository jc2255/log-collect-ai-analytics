# ==========================================================
# LCA 高可用部署编排 (docker-compose.ha.yaml)
# 使用方式: docker compose -f docker-compose.ha.yaml up -d
# ==========================================================
services:
  # ==================== MySQL 主从 ====================

  mysql-master:
    image: ccr.ccs.tencentyun.com/lcalog/mysql8:v1
    container_name: lca-mysql-master
    restart: always
    ports:
      - "3306:3306"
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-lca2024}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lca}
      MYSQL_CHARSET: utf8mb4
    volumes:
      - mysql_master_data:/var/lib/mysql
      - ./deploy/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./deploy/ha/mysql-master.cnf:/etc/mysql/conf.d/master.cnf
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-lca2024}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lca-ha-net

  mysql-slave:
    image: ccr.ccs.tencentyun.com/lcalog/mysql8:v1
    container_name: lca-mysql-slave
    restart: always
    ports:
      - "3307:3306"
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-lca2024}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lca}
      MYSQL_CHARSET: utf8mb4
    volumes:
      - mysql_slave_data:/var/lib/mysql
      - ./deploy/ha/mysql-slave.cnf:/etc/mysql/conf.d/slave.cnf
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    depends_on:
      mysql-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-lca2024}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lca-ha-net

  # ==================== Redis Sentinel ====================

  redis-master:
    image: ccr.ccs.tencentyun.com/lcalog/redis:v1
    container_name: lca-redis-master
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_master_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-lca2024}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-lca2024}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lca-ha-net

  redis-slave1:
    image: ccr.ccs.tencentyun.com/lcalog/redis:v1
    container_name: lca-redis-slave1
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis_slave1_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-lca2024} --replicaof redis-master 6379 --masterauth ${REDIS_PASSWORD:-lca2024}
    depends_on:
      - redis-master
    networks:
      - lca-ha-net

  redis-slave2:
    image: ccr.ccs.tencentyun.com/lcalog/redis:v1
    container_name: lca-redis-slave2
    restart: always
    ports:
      - "6381:6379"
    volumes:
      - redis_slave2_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-lca2024} --replicaof redis-master 6379 --masterauth ${REDIS_PASSWORD:-lca2024}
    depends_on:
      - redis-master
    networks:
      - lca-ha-net

  redis-sentinel1:
    image: ccr.ccs.tencentyun.com/lcalog/redis:v1
    container_name: lca-redis-sentinel1
    restart: always
    ports:
      - "26379:26379"
    volumes:
      - ./deploy/ha/sentinel1.conf:/etc/redis/sentinel.conf
      - sentinel1_data:/data
    command: redis-sentinel /etc/redis/sentinel.conf
    depends_on:
      - redis-master
      - redis-slave1
      - redis-slave2
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lca-ha-net

  redis-sentinel2:
    image: ccr.ccs.tencentyun.com/lcalog/redis:v1
    container_name: lca-redis-sentinel2
    restart: always
    ports:
      - "26380:26379"
    volumes:
      - ./deploy/ha/sentinel2.conf:/etc/redis/sentinel.conf
      - sentinel2_data:/data
    command: redis-sentinel /etc/redis/sentinel.conf
    depends_on:
      - redis-master
      - redis-slave1
      - redis-slave2
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lca-ha-net

  redis-sentinel3:
    image: ccr.ccs.tencentyun.com/lcalog/redis:v1
    container_name: lca-redis-sentinel3
    restart: always
    ports:
      - "26381:26379"
    volumes:
      - ./deploy/ha/sentinel3.conf:/etc/redis/sentinel.conf
      - sentinel3_data:/data
    command: redis-sentinel /etc/redis/sentinel.conf
    depends_on:
      - redis-master
      - redis-slave1
      - redis-slave2
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lca-ha-net

  # ==================== Kafka 集群 (3 Broker) ====================

  zookeeper:
    image: ccr.ccs.tencentyun.com/lcalog/zookeeper:v1
    container_name: lca-zookeeper
    restart: always
    environment:
      TZ: Asia/Shanghai
    networks:
      - lca-ha-net

  kafka1:
    image: ccr.ccs.tencentyun.com/lcalog/kafka:v1
    container_name: lca-kafka1
    restart: always
    environment:
      TZ: Asia/Shanghai
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:9092
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_COMPRESSION_TYPE: lz4
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka1_data:/kafka
    depends_on:
      - zookeeper
    networks:
      - lca-ha-net

  kafka2:
    image: ccr.ccs.tencentyun.com/lcalog/kafka:v1
    container_name: lca-kafka2
    restart: always
    environment:
      TZ: Asia/Shanghai
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:9092
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_COMPRESSION_TYPE: lz4
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka2_data:/kafka
    depends_on:
      - zookeeper
    networks:
      - lca-ha-net

  kafka3:
    image: ccr.ccs.tencentyun.com/lcalog/kafka:v1
    container_name: lca-kafka3
    restart: always
    environment:
      TZ: Asia/Shanghai
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka3:9092
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_COMPRESSION_TYPE: lz4
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka3_data:/kafka
    depends_on:
      - zookeeper
    networks:
      - lca-ha-net

  # ==================== Elasticsearch 集群 (3 Node) ====================

  es01:
    build:
      context: .
      dockerfile: deploy/Dockerfile.es
    container_name: lca-es01
    restart: always
    environment:
      - TZ=Asia/Shanghai
      - node.name=es01
      - cluster.name=lca-es-cluster
      - discovery.seed_hosts=es02,es03
      - cluster.initial_master_nodes=es01,es02,es03
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=${ES_JAVA_OPTS:--Xms512m -Xmx512m}"
      - "path.repo=/data/backups"
      - bootstrap.system_call_filter=false
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - es01_data:/usr/share/elasticsearch/data
      - es_backups:/data/backups
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - lca-ha-net

  es02:
    build:
      context: .
      dockerfile: deploy/Dockerfile.es
    container_name: lca-es02
    restart: always
    environment:
      - TZ=Asia/Shanghai
      - node.name=es02
      - cluster.name=lca-es-cluster
      - discovery.seed_hosts=es01,es03
      - cluster.initial_master_nodes=es01,es02,es03
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=${ES_JAVA_OPTS:--Xms512m -Xmx512m}"
      - "path.repo=/data/backups"
      - bootstrap.system_call_filter=false
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - es02_data:/usr/share/elasticsearch/data
      - es_backups:/data/backups
    networks:
      - lca-ha-net

  es03:
    build:
      context: .
      dockerfile: deploy/Dockerfile.es
    container_name: lca-es03
    restart: always
    environment:
      - TZ=Asia/Shanghai
      - node.name=es03
      - cluster.name=lca-es-cluster
      - discovery.seed_hosts=es01,es02
      - cluster.initial_master_nodes=es01,es02,es03
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=${ES_JAVA_OPTS:--Xms512m -Xmx512m}"
      - "path.repo=/data/backups"
      - bootstrap.system_call_filter=false
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - es03_data:/usr/share/elasticsearch/data
      - es_backups:/data/backups
    networks:
      - lca-ha-net

  # ==================== 应用服务 (多实例) ====================

  admin1:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        APP_NAME: admin
    container_name: lca-admin1
    restart: always
    volumes:
      - ./configs/admin-ha.yaml:/app/config.yaml
      - ./configs/rbac_model.conf:/app/rbac_model.conf
    depends_on:
      mysql-master:
        condition: service_healthy
      redis-master:
        condition: service_healthy
      es01:
        condition: service_healthy
      redis-sentinel1:
        condition: service_healthy
      redis-sentinel2:
        condition: service_healthy
      redis-sentinel3:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    networks:
      - lca-ha-net

  admin2:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        APP_NAME: admin
    container_name: lca-admin2
    restart: always
    volumes:
      - ./configs/admin-ha.yaml:/app/config.yaml
      - ./configs/rbac_model.conf:/app/rbac_model.conf
    depends_on:
      mysql-master:
        condition: service_healthy
      redis-master:
        condition: service_healthy
      es01:
        condition: service_healthy
      redis-sentinel1:
        condition: service_healthy
      redis-sentinel2:
        condition: service_healthy
      redis-sentinel3:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    networks:
      - lca-ha-net

  apiserver1:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        APP_NAME: apiserver
    container_name: lca-apiserver1
    restart: always
    volumes:
      - ./configs/apiserver-ha.yaml:/app/config.yaml
    depends_on:
      mysql-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8086/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    networks:
      - lca-ha-net

  apiserver2:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        APP_NAME: apiserver
    container_name: lca-apiserver2
    restart: always
    volumes:
      - ./configs/apiserver-ha.yaml:/app/config.yaml
    depends_on:
      mysql-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8086/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    networks:
      - lca-ha-net

  logtransfer1:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        APP_NAME: logtransfer
    container_name: lca-logtransfer1
    restart: always
    volumes:
      - ./configs/logtransfer-ha.yaml:/app/config.yaml
    depends_on:
      mysql-master:
        condition: service_healthy
      es01:
        condition: service_healthy
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    networks:
      - lca-ha-net

  logtransfer2:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        APP_NAME: logtransfer
    container_name: lca-logtransfer2
    restart: always
    volumes:
      - ./configs/logtransfer-ha.yaml:/app/config.yaml
    depends_on:
      mysql-master:
        condition: service_healthy
      es01:
        condition: service_healthy
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    networks:
      - lca-ha-net

  # ==================== Nginx 负载均衡 ====================

  nginx:
    image: docker.m.daocloud.io/library/nginx:1.25-alpine
    container_name: lca-nginx-ha
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./deploy/ha/nginx-ha.conf:/etc/nginx/conf.d/default.conf
      - ./release/web-dist:/usr/share/nginx/html
    depends_on:
      - admin1
      - admin2
      - apiserver1
      - apiserver2
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - lca-ha-net

# ==================== Volumes ====================
volumes:
  mysql_master_data:
  mysql_slave_data:
  redis_master_data:
  redis_slave1_data:
  redis_slave2_data:
  sentinel1_data:
  sentinel2_data:
  sentinel3_data:
  kafka1_data:
  kafka2_data:
  kafka3_data:
  es01_data:
  es02_data:
  es03_data:
  es_backups:

networks:
  lca-ha-net:
    driver: bridge
