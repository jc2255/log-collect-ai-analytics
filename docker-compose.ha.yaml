# ==========================================================
# LCA 高可用部署编排 (docker-compose.ha.yaml)
# 使用方式:
#   make docker-up-ha
#   # 或: bash scripts/ensure-binaries.sh && docker compose -f docker-compose.ha.yaml up -d --build
# 说明: 高可用聚焦在压力大的 Kafka 集群、ES 集群、apiserver；
#       MySQL/Redis/admin/logtransfer 采用单实例（业务压力小）；
#       所有应用服务日志挂载到宿主机 ./logs/<svc> 便于排查。
# 架构: 基础设施与应用镜像均支持 linux/amd64 与 linux/arm64 (aarch64)。
# ==========================================================
services:
  # ==================== MySQL 单实例 ====================

  mysql:
    # 官方多架构镜像（linux/amd64 + linux/arm64）
    image: docker.m.daocloud.io/library/mysql:8.0
    container_name: lca-mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-lca2024}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lca}
      MYSQL_CHARSET: utf8mb4
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deploy/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-lca2024}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lca-ha-net

  # ==================== Redis 单实例 ====================

  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    container_name: lca-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-lca2024}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-lca2024}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lca-ha-net

  # ==================== Kafka 集群 (3 Broker) ====================

  zookeeper:
    image: docker.m.daocloud.io/library/zookeeper:3.9
    container_name: lca-zookeeper
    restart: always
    environment:
      TZ: Asia/Shanghai
    networks:
      - lca-ha-net

  kafka1:
    # wurstmeister 多架构（amd64/arm64），环境变量与历史 lcalog/kafka 兼容
    image: docker.m.daocloud.io/wurstmeister/kafka:2.13-2.8.1
    container_name: lca-kafka1
    restart: always
    environment:
      TZ: Asia/Shanghai
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:9092
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_COMPRESSION_TYPE: lz4
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # 内部 __consumer_offsets / 事务元数据 topic 副本数，与 min.insync.replicas=2 匹配，避免 coordinator 不可用
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    volumes:
      - kafka1_data:/kafka
    depends_on:
      - zookeeper
    networks:
      - lca-ha-net

  kafka2:
    image: docker.m.daocloud.io/wurstmeister/kafka:2.13-2.8.1
    container_name: lca-kafka2
    restart: always
    environment:
      TZ: Asia/Shanghai
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:9092
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_COMPRESSION_TYPE: lz4
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    volumes:
      - kafka2_data:/kafka
    depends_on:
      - zookeeper
    networks:
      - lca-ha-net

  kafka3:
    image: docker.m.daocloud.io/wurstmeister/kafka:2.13-2.8.1
    container_name: lca-kafka3
    restart: always
    environment:
      TZ: Asia/Shanghai
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka3:9092
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_COMPRESSION_TYPE: lz4
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    volumes:
      - kafka3_data:/kafka
    depends_on:
      - zookeeper
    networks:
      - lca-ha-net

  # ==================== Elasticsearch 集群 (3 Node) ====================

  es01:
    build:
      context: .
      dockerfile: deploy/Dockerfile.es
      args:
        ES_VERSION: "7.17.25"
    image: lca-elasticsearch:7.17.25
    container_name: lca-es01
    restart: always
    entrypoint: ["/bin/tini", "--", "/bin/bash", "/usr/local/bin/lca-es-entrypoint.sh"]
    command: ["eswrapper"]
    environment:
      - TZ=Asia/Shanghai
      - node.name=es01
      - cluster.name=lca-es-cluster
      - discovery.seed_hosts=es02,es03
      - cluster.initial_master_nodes=es01,es02,es03
      - bootstrap.memory_lock=true
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=${ES_JAVA_OPTS:--Xms512m -Xmx512m} -Duser.timezone=Asia/Shanghai"
      - "path.repo=/data/backups"
      - bootstrap.system_call_filter=false
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - es01_data:/usr/share/elasticsearch/data
      - es_backups:/data/backups
      - ./deploy/es/entrypoint.sh:/usr/local/bin/lca-es-entrypoint.sh:ro
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - lca-ha-net

  es02:
    image: lca-elasticsearch:7.17.25
    depends_on:
      - es01
    container_name: lca-es02
    restart: always
    entrypoint: ["/bin/tini", "--", "/bin/bash", "/usr/local/bin/lca-es-entrypoint.sh"]
    command: ["eswrapper"]
    environment:
      - TZ=Asia/Shanghai
      - node.name=es02
      - cluster.name=lca-es-cluster
      - discovery.seed_hosts=es01,es03
      - cluster.initial_master_nodes=es01,es02,es03
      - bootstrap.memory_lock=true
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=${ES_JAVA_OPTS:--Xms512m -Xmx512m} -Duser.timezone=Asia/Shanghai"
      - "path.repo=/data/backups"
      - bootstrap.system_call_filter=false
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - es02_data:/usr/share/elasticsearch/data
      - es_backups:/data/backups
      - ./deploy/es/entrypoint.sh:/usr/local/bin/lca-es-entrypoint.sh:ro
    networks:
      - lca-ha-net

  es03:
    image: lca-elasticsearch:7.17.25
    depends_on:
      - es01
    container_name: lca-es03
    restart: always
    entrypoint: ["/bin/tini", "--", "/bin/bash", "/usr/local/bin/lca-es-entrypoint.sh"]
    command: ["eswrapper"]
    environment:
      - TZ=Asia/Shanghai
      - node.name=es03
      - cluster.name=lca-es-cluster
      - discovery.seed_hosts=es01,es02
      - cluster.initial_master_nodes=es01,es02,es03
      - bootstrap.memory_lock=true
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=${ES_JAVA_OPTS:--Xms512m -Xmx512m} -Duser.timezone=Asia/Shanghai"
      - "path.repo=/data/backups"
      - bootstrap.system_call_filter=false
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - es03_data:/usr/share/elasticsearch/data
      - es_backups:/data/backups
      - ./deploy/es/entrypoint.sh:/usr/local/bin/lca-es-entrypoint.sh:ro
    networks:
      - lca-ha-net

  # ==================== 应用服务（admin/logtransfer 单机，apiserver 双节点 HA） ====================

  admin:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        APP_NAME: admin
        TARGETARCH: ${LCA_TARGETARCH}
    container_name: lca-admin
    restart: always
    volumes:
      - ./configs/admin-ha.yaml:/app/config.yaml
      - ./configs/rbac_model.conf:/app/configs/rbac_model.conf
      # 机器ID持久化（避免容器重启后机器ID变化导致授权码失效）
      - ./data/admin:/app/data
      # 日志挂载到宿主机便于排查
      - ./logs/admin:/app/logs
      # 商业交付：预编译 Agent，供一键部署脚本从管理端下载
      - ./release/bin:/app/agent-bin:ro
    environment:
      # 也可通过环境变量手动锁定机器ID（客户购买后设置可避免任何意外变化）
      LCA_MACHINE_ID: "${LCA_MACHINE_ID:-}"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      es01:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    networks:
      - lca-ha-net

  apiserver1:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        APP_NAME: apiserver
        TARGETARCH: ${LCA_TARGETARCH}
    container_name: lca-apiserver1
    restart: always
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./configs/apiserver-ha.yaml:/app/config.yaml
      - ./logs/apiserver1:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8086/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: '2.0'
    networks:
      - lca-ha-net

  apiserver2:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        APP_NAME: apiserver
        TARGETARCH: ${LCA_TARGETARCH}
    container_name: lca-apiserver2
    restart: always
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./configs/apiserver-ha.yaml:/app/config.yaml
      - ./logs/apiserver2:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8086/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: '2.0'
    networks:
      - lca-ha-net

  logtransfer:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        APP_NAME: logtransfer
        TARGETARCH: ${LCA_TARGETARCH}
    container_name: lca-logtransfer
    restart: always
    volumes:
      - ./configs/logtransfer-ha.yaml:/app/config.yaml
      - ./logs/logtransfer:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      es01:
        condition: service_healthy
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    networks:
      - lca-ha-net


  # ==================== Syslog 接收器（单实例，直接暴露端口保留真实 IP） ====================

  syslog:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        APP_NAME: syslog
        TARGETARCH: ${LCA_TARGETARCH}
    container_name: lca-syslog
    restart: always
    ports:
      # 直接映射端口（不经 nginx，Docker DNAT 保留真实源 IP）
      - "514:514/udp"
      - "514:514/tcp"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./configs/syslog-ha-docker.yaml:/app/config.yaml
      - ./logs/syslog:/app/logs
      - ./data/syslog/dead_letters:/app/dead_letters
    depends_on:
      - apiserver1
      - apiserver2
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '1.0'
    networks:
      - lca-ha-net

  # ==================== Nginx 负载均衡（仅 HTTP） ====================

  nginx:
    image: docker.m.daocloud.io/library/nginx:1.25-alpine
    container_name: lca-nginx-ha
    restart: always
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "80:80"
    volumes:
      # 主配置
      - ./deploy/ha/nginx.conf:/etc/nginx/nginx.conf
      # HTTP 层配置
      - ./deploy/ha/nginx-ha.conf:/etc/nginx/conf.d/default.conf
      # 前端静态文件
      - ./release/web-dist:/usr/share/nginx/html
      # 日志
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - admin
      - apiserver1
      - apiserver2
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - lca-ha-net

# ==================== Volumes ====================
volumes:
  mysql_data:
  redis_data:
  kafka1_data:
  kafka2_data:
  kafka3_data:
  es01_data:
  es02_data:
  es03_data:
  es_backups:

networks:
  lca-ha-net:
    driver: bridge
