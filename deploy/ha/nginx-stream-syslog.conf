# ==========================================================
# Syslog L4 Stream 负载均衡
# 监听 514 端口，UDP/TCP 流量通过 least_conn 分发到 3 个实例
# TCP 启用 PROXY Protocol 传递真实客户端 IP
# ==========================================================

upstream syslog_udp {
    least_conn;
    server syslog1:1514 max_fails=3 fail_timeout=30s;
    server syslog2:2514 max_fails=3 fail_timeout=30s;
    server syslog3:3514 max_fails=3 fail_timeout=30s;
}

upstream syslog_tcp {
    least_conn;
    server syslog1:1514 max_fails=3 fail_timeout=30s;
    server syslog2:2514 max_fails=3 fail_timeout=30s;
    server syslog3:3514 max_fails=3 fail_timeout=30s;
}

server {
    listen 514 udp;
    proxy_pass syslog_udp;
    proxy_responses 0;
    proxy_timeout 5s;
}

server {
    listen 514;
    proxy_pass syslog_tcp;
    proxy_protocol on;
    proxy_connect_timeout 5s;
    proxy_timeout 600s;
}
