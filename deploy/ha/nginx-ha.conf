# ==========================================================
# LCA 高可用 Nginx 配置 - 负载均衡 + 健康检查
# ==========================================================

upstream admin_backend {
    least_conn;
    server admin1:8080 max_fails=3 fail_timeout=15s;
    server admin2:8080 max_fails=3 fail_timeout=15s;
}

upstream apiserver_backend {
    least_conn;
    server apiserver1:8086 max_fails=3 fail_timeout=15s;
    server apiserver2:8086 max_fails=3 fail_timeout=15s;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 前端路由 - Vue3 History模式
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 管理后台API代理 - 负载均衡到多个 admin 实例
    location /api/ {
        proxy_pass http://admin_backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    # 日志投递API代理 - 负载均衡到多个 apiserver 实例
    location /log/ {
        proxy_pass http://apiserver_backend/log/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 10m;
        proxy_connect_timeout 10s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # 健康检查
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
