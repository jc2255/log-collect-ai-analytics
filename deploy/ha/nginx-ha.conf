# ==========================================================
# LCA 高可用 Nginx 配置 - 负载均衡 + 健康检查
# ==========================================================

upstream admin_backend {
    # admin 单机部署（业务压力小，HA 仅保留在 apiserver/Kafka/ES）
    server admin:8080 max_fails=3 fail_timeout=15s;
}

upstream apiserver_backend {
    least_conn;
    server apiserver1:8086 max_fails=3 fail_timeout=15s;
    server apiserver2:8086 max_fails=3 fail_timeout=15s;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 前端路由 - Vue3 History模式
    location / {
        try_files $uri $uri/ /index.html;
    }

    # agent 日志投递专用路由（精确匹配，优先级高于 /api/）
    # apiserver 默认不对外暴露 8086 端口，agent 通过 nginx 的 80 端口走 HA upstream
    location = /api/v1/log/push {
        proxy_pass http://apiserver_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
        client_max_body_size 50m;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    # 管理后台API代理 - 负载均衡到多个 admin 实例
    # ⚠️ /api/v1/log/push 路径在上面用 location = 精确匹配领走了，不会进入这里
    location /api/ {
        proxy_pass http://admin_backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    # ⚠️ 以前这里有 location /log/ 代理到 apiserver，会拦截前端 SPA 路由 /log/list 导致刷新 404
    # apiserver 真正路径为 /api/v1/log/push，agent 直连 8086（不走 nginx），这里不需要代理

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # 健康检查
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
