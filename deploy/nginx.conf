server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 全局请求体上限：默认 1M太小，文件上传/高级查询容易413；推送接口在其location内单独放大到 50M
    client_max_body_size 5m;

    # 前端路由 - Vue3 History模式
    location / {
        try_files $uri $uri/ /index.html;
    }

    # agent 日志投递专用路由（精确匹配，优先级高于 /api/）
    # apiserver 默认不对外暴露 8086 端口，agent 通过 nginx 的 80 端口走 apiserver
    location = /api/v1/log/push {
        proxy_pass http://lca-apiserver:8086;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        client_max_body_size 50m;
        # 关掉请求体缓冲：大负载边收边传给 apiserver，避免 nginx 缓冲 5MB 拖慢整体延迟
        proxy_request_buffering off;
    }

    # 管理后台API代理
    # ⚠️ /api/v1/log/push 在上面用 location = 精确匹配领走，不会进入这里
    location /api/ {
        proxy_pass http://lca-admin:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ⚠️ 以前这里有 location /log/ 代理到 apiserver，会拦截前端 SPA 路由 /log/list 导致刷新 404
    # apiserver 真正路径为 /api/v1/log/push，agent 直连 8086（不走 nginx），这里不需要代理

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # 健康检查
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
