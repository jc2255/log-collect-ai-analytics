server:
  name: "lca-admin"
  port: 8080
  mode: "release"

mysql:
  host: "lca-mysql"
  port: 3306
  user: "root"
  password: "lca2024"
  dbname: "lca"
  max_open_conns: 100
  max_idle_conns: 10

redis:
  host: "lca-redis"
  port: 6379
  password: "lca2024"
  db: 0

kafka:
  brokers:
    - "lca-kafka:9092"
