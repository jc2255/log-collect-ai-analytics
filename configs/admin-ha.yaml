server:
  name: "lca-admin"
  port: 8080
  mode: "release"

# lca.top 远程授权验证服务地址（权威数据源，用于验证 www.lca.top 购买的授权码）
# 为空时则仅使用本地 RSA 验签（需 license.public_key 与签发私钥严格对应）
lca_top_url: "https://www.lca.top"

mysql:
  host: "mysql"
  port: 3306
  user: "root"
  password: "lca2024"
  dbname: "lca"
  max_open_conns: 100
  max_idle_conns: 10

redis:
  host: "redis"
  port: 6379
  password: "lca2024"
  db: 0
  pool_size: 30
  max_retries: 3

kafka:
  brokers:
    - "kafka1:9092"
    - "kafka2:9092"
    - "kafka3:9092"
  group_id: "lca-admin"
  topic: "lca-log"

elasticsearch:
  addresses:
    - "http://es01:9200"
    - "http://es02:9200"
    - "http://es03:9200"
  username: ""
  password: ""
  sniff: false

jwt:
  secret: "lca-secret-key-change-in-production"
  expire_hour: 24
  issuer: "lca-admin"

log:
  level: "info"
  filename: "/app/logs/admin.log"
  max_size: 100
  max_backups: 5
  max_age: 30
  compress: false

