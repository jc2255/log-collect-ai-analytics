version: "3"
services:
 zookeeper:
  image: wurstmeister/zookeeper
  restart: always
  ports:
   - "2181:2181"
 kafka:
  image: wurstmeister/kafka
  hostname: kafka
  restart: always
  ports:
   - "19004:19004"
   - "9092:9092"
  environment:
   TZ: CST-8
   KAFKA_BROKER_ID: 3
   KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
   KAFKA_LISTENERS: INSIDE://:9092,OUTSIDE://:19004
   KAFKA_ADVERTISED_LISTENERS: INSIDE://172.16.0.70:9092,OUTSIDE://47.113.182.12:19004
   KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT
   KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
   KAFKA_HEAP_OPTS: "-Xms3g -Xmx3g"
   KAFKA_LINGER_MS: 0                    # 零延迟
   KAFKA_BATCH_SIZE: 32768               # 32KB 批次
   KAFKA_COMPRESSION_TYPE: lz4           # 快速压缩
   KAFKA_ACKS: 1                         # 快速确认
   KAFKA_BUFFER_MEMORY: 67108864         # 64MB 缓冲区
   KAFKA_LOG_RETENTION_HOURS: 24         # 日志保留72小时
   KAFKA_LOG_SEGMENT_BYTES: 536870912    # 日志分段大小512MB
  volumes:
   - /var/run/docker.sock:/var/run/docker.sock
  links:
   - zookeeper